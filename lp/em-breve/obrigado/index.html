  <!-- Guard de acesso direto: /em-breve/obrigado só existe pra quem acabou
       de se cadastrar (a chave é gravada por ../script.js, logo antes do
       redirect pra cá). Roda ANTES de qualquer outra coisa no <head> —
       sem CSS/DOM pra pintar ainda, então quem entra sem a chave nunca vê
       o conteúdo de agradecimento piscar antes de sair. location.replace()
       (não href) também não empilha /obrigado no histórico: apertar
       "voltar" depois não retorna pra esta tela.
       Lê a chave e já apaga na hora: um "obrigado" é o fechamento de UMA
       navegação, não um estado permanente — dar F5 ou voltar pelo
       histórico deve mandar pra /em-breve de novo, não reabrir a festa
       com dado velho de uma sessão anterior. -->
  <script>
  (function () {
    var raw;
    try { raw = sessionStorage.getItem('legalizai_thanks'); } catch (e) { raw = null; }
    if (!raw) { location.replace('/em-breve'); return; }
    try {
      window.__legalizaiThanks = JSON.parse(raw);
      sessionStorage.removeItem('legalizai_thanks');
    } catch (e) {
      location.replace('/em-breve');
    }
  })();
  </script>
